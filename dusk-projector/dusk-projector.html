      c.getContext('2d').putImageData(image, 0, 0);
      result.push(c);
    }
    const n = result[0].getContext('2d');
    n.drawImage(night, WINDOW.x, WINDOW.y, WINDOW.w, WINDOW.h, 0, 0, WINDOW.w, WINDOW.h);
    n.fillStyle = 'rgba(114,150,192,0.025)'; n.fillRect(0, 0, WINDOW.w, WINDOW.h);
    result.push(source);
    return result;
  }

  function makeMovingParts() {
    gripSprite = offscreen(111, 48);
    const g = gripSprite.getContext('2d');
    g.beginPath();
    g.moveTo(5, 14); g.bezierCurveTo(18, 3, 38, 7, 75, 8);
    g.bezierCurveTo(95, 7, 108, 12, 109, 24);
    g.bezierCurveTo(109, 39, 99, 44, 79, 39);
    g.bezierCurveTo(47, 33, 15, 34, 5, 26); g.closePath(); g.clip();
    g.drawImage(peak, 397, 1121, 111, 48, 0, 0, 111, 48);
    reels = [
      { x: 147, y: 965, rx: 55, ry: 128, tilt: 0.145 },
      { x: 254, y: 1002, rx: 26, ry: 53, tilt: 0.10 },
    ].map(reel => {
      const texture = offscreen(300, 300), t = texture.getContext('2d');
      t.translate(150, 150); t.scale(150 / reel.rx, 150 / reel.ry); t.rotate(-reel.tilt);
      t.drawImage(night, -reel.x, -reel.y);
      return { ...reel, texture };
    });
  }

  function resize() {
    if (!ready) return;
    if (pointer !== null) releasePointer();
    const bounds = world.getBoundingClientRect();
    layout.width = bounds.width; layout.height = bounds.height;
    layout.dpr = Math.min(devicePixelRatio || 1, 2);
    layout.s = Math.min(bounds.width / W, bounds.height / VIEW_H);
    layout.x = (bounds.width - W * layout.s) / 2;
    const viewY = (bounds.height - VIEW_H * layout.s) / 2;
    layout.y = viewY - CROP_Y * layout.s;
    canvas.width = Math.round(bounds.width * layout.dpr);
    canvas.height = Math.round(bounds.height * layout.dpr);
    base = offscreen(canvas.width, canvas.height);
    const b = base.getContext('2d'); b.scale(layout.dpr, layout.dpr);
    b.fillStyle = '#0b1c33'; b.fillRect(0, 0, bounds.width, bounds.height);
    // One registered 3:4 crop keeps sky, mountains, projector and grass in one image plane.
    b.drawImage(night, 0, CROP_Y, W, VIEW_H, layout.x, viewY, W * layout.s, VIEW_H * layout.s);
    hint.style.left = '50%';
    hint.style.top = `${Math.min(layout.y + 1300 * layout.s, bounds.height - 90)}px`;
    draw();
  }

  function gripPosition() {
    const dx = GRIP.x - AXLE.x, dy = GRIP.y - AXLE.y;
    return { x: AXLE.x + dx * Math.cos(angle) - dy * Math.sin(angle),
      y: AXLE.y + dx * Math.sin(angle) + dy * Math.cos(angle) };
  }
  function drawCrank() {
    ctx.save(); ctx.translate(AXLE.x, AXLE.y + press * 4); ctx.rotate(angle);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const armPath = () => {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(29, 8);
      ctx.quadraticCurveTo(36, 10, 40, 0); ctx.lineTo(67, -34);
      ctx.quadraticCurveTo(72, -39, 82, -33); ctx.lineTo(91, -27);
    };
    armPath(); ctx.lineWidth = 13; ctx.strokeStyle = '#1b1d1d'; ctx.stroke();
    const metal = ctx.createLinearGradient(0, -34, 40, 16);
    metal.addColorStop(0, '#c1975a'); metal.addColorStop(0.3, '#71603d'); metal.addColorStop(0.55, '#d2ac70'); metal.addColorStop(1, '#3d3428');
    armPath(); ctx.lineWidth = 6.4; ctx.strokeStyle = metal; ctx.stroke();
    ctx.drawImage(gripSprite, 79, -51);
    ctx.restore();
    ctx.save(); ctx.translate(AXLE.x, AXLE.y);
    ctx.fillStyle = '#353332'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 11, 0.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#927449'; ctx.lineWidth = 1.3; ctx.stroke(); ctx.restore();
    const p = gripPosition();
    crank.style.left = `${layout.x + p.x * layout.s}px`;
    crank.style.top = `${layout.y + (p.y + press * 4) * layout.s}px`;
  }

  function drawReel(reel, rotation) {
    ctx.save(); ctx.translate(reel.x, reel.y); ctx.rotate(reel.tilt); ctx.scale(reel.rx, reel.ry);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.clip(); ctx.rotate(rotation);
    ctx.drawImage(reel.texture, -1, -1, 2, 2); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.ellipse(reel.x, reel.y, 8, 13, reel.tilt, 0, TAU); ctx.clip();
    ctx.drawImage(night, 0, 0); ctx.restore();
  }

  function drawBeam() {
    const brightness = engine.weights.reduce((sum, weight, i) => sum + weight * (0.045 + i / 7 * 0.275), 0);
    ctx.save();
    ctx.filter = 'blur(8px)';
    const gradient = ctx.createLinearGradient(LENS.x, LENS.y, 478, 701);
    gradient.addColorStop(0, `rgba(241,208,155,${brightness + flash * 0.15})`);
    gradient.addColorStop(0.48, `rgba(236,199,147,${brightness * 0.23})`);
    gradient.addColorStop(1, 'rgba(200,186,164,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath(); ctx.moveTo(LENS.x - 4, LENS.y + 4); ctx.lineTo(278, 740); ctx.lineTo(620, 739); ctx.lineTo(LENS.x + 10, LENS.y - 6); ctx.closePath(); ctx.fill();
    ctx.filter = 'none';
    const glow = ctx.createRadialGradient(LENS.x, LENS.y, 1, LENS.x, LENS.y, 22);
    glow.addColorStop(0, `rgba(252,226,180,${0.26 + brightness + flash * 0.2})`);
    glow.addColorStop(0.2, `rgba(246,204,133,${brightness})`); glow.addColorStop(1, 'rgba(245,204,139,0)');
    ctx.fillStyle = glow; ctx.fillRect(LENS.x - 22, LENS.y - 22, 44, 44);
    ctx.restore();
    drawDust(brightness);
  }

  function drawDust(brightness) {
    const time = motionPreference.matches ? 0 : engine.time;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const particle of dust) {
      const depth = particle.depth;
      const centerX = LENS.x + (449 - LENS.x) * depth;
      const halfWidth = 12 + 162 * depth;
      const x = centerX + particle.spread * halfWidth + Math.sin(time * 0.38 + particle.phase) * (2 + depth * 4);
      const y = LENS.y + (741 - LENS.y) * depth + Math.cos(time * 0.27 + particle.phase * 1.7) * 5;
      const pulse = 0.48 + 0.52 * Math.sin(time * 0.65 + particle.phase) ** 2;
      const alpha = (0.045 + brightness * 0.78) * particle.glow * pulse;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#f4eddc';
      ctx.shadowColor = '#f1d49f'; ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.arc(x, y, particle.size, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    if (!ready) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(base, 0, 0);
    ctx.setTransform(layout.dpr * layout.s, 0, 0, layout.dpr * layout.s, layout.dpr * layout.x, layout.dpr * layout.y);
    // Opaque weighted mixture, avoiding alpha-over darkening at stage boundaries.
    ctx.drawImage(stages[0], WINDOW.x, WINDOW.y);
    let total = engine.weights[0];
    for (let i = 1; i < stages.length; i++) {
      const weight = engine.weights[i];
      if (weight > 0) {
        total += weight; ctx.globalAlpha = weight / total;
        ctx.drawImage(stages[i], WINDOW.x, WINDOW.y);
      }
    }
    ctx.globalAlpha = 1;
    drawBeam();
    drawReel(reels[0], reelAngle); drawReel(reels[1], -reelAngle * 1.34);
    drawCrank();
    if (!motionPreference.matches) {
      ctx.lineCap = 'round';
      for (const blade of grass) {
        const sway = Math.sin(engine.time * 0.75 + blade.phase) * 3 + Math.sin(engine.time * 0.37 + blade.phase) * 2;
        ctx.beginPath(); ctx.moveTo(blade.x, blade.y);
        ctx.quadraticCurveTo(blade.x + 7 + sway, blade.y - blade.length * 0.6, blade.x + 13 + sway, blade.y - blade.length);
        ctx.strokeStyle = blade.x < 580 ? 'rgba(170,146,91,0.22)' : 'rgba(111,135,138,0.17)';
        ctx.lineWidth = 1.1; ctx.stroke();
      }
    }
    for (const spark of sparks) {
      const t = (engine.time - spark.born) / 0.57;
      if (t < 0 || t > 1) continue;
      const eased = 1 - (1 - t) ** 2;
      const x = motionPreference.matches ? LENS.x : LENS.x + 144 * eased;
      const y = motionPreference.matches ? LENS.y : LENS.y - 236 * eased - 8 * Math.sin(t * Math.PI);
      ctx.globalAlpha = (1 - t) * 0.95;
      ctx.fillStyle = '#f5ecdc'; ctx.shadowColor = '#edce9d'; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.arc(x, y, Math.max(2.3, 1.3 / layout.s), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    hint.classList.toggle('hidden', engine.learned);
    world.dataset.stage = stageNames[engine.stage];
    world.dataset.phase = engine.phase;
    world.dataset.progress = engine.q.toFixed(3);
    if (lastSpokeStage !== engine.stage) {
      lastSpokeStage = engine.stage; status.textContent = stageWords[engine.stage];
    }
  }

  function emitSpark(force = false) {
    if (engine.time - lastSpark < 0.18 && !force) return;
    if (sparks.length >= 3) sparks.shift();
    sparks.push({ born: engine.time }); lastSpark = engine.time; flash = 1;
  }
  function polar(event) {
    const rect = world.getBoundingClientRect();
    const x = event.clientX - rect.left - layout.x - AXLE.x * layout.s;
    const y = event.clientY - rect.top - layout.y - AXLE.y * layout.s;
    return Math.hypot(x, y) < 12 ? null : Math.atan2(y, x);
  }
  function releasePointer() {
    if (pointer === null) return;
    const id = pointer; pointer = null; previousPolar = null;
    if (crank.hasPointerCapture(id)) crank.releasePointerCapture(id);
    engine.release();
  }
  crank.addEventListener('pointerdown', event => {
    if (!ready || pointer !== null || event.button !== 0) return;
    event.preventDefault(); pointer = event.pointerId;
    previousPolar = polar(event); previousMoveTime = performance.now();
    suppressPointerClickUntil = performance.now() + 600;
    crank.setPointerCapture(pointer); engine.touch(); press = 1; emitSpark(true);
    audio.activate();
    audio.click(0.65); draw();
  });
  crank.addEventListener('pointermove', event => {
    if (event.pointerId !== pointer) return;
    event.preventDefault();
    const next = polar(event);
    if (next === null || previousPolar === null) { previousPolar = next; return; }
    let delta = next - previousPolar;
    if (delta > Math.PI) delta -= TAU;
    if (delta < -Math.PI) delta += TAU;
    previousPolar = next;
    const now = performance.now();
    if (Math.abs(delta) > Math.PI * 0.65) { previousMoveTime = now; return; }
    angle += delta;
    angularVelocity = clamp(delta / Math.max(0.012, (now - previousMoveTime) / 1000), -8, 8);
    previousMoveTime = now;
    reelAngle += delta * 0.35;
    if (delta > 0) {
      engine.turn(delta); sparkDistance += delta;
      if (sparkDistance > Math.PI / 3) { emitSpark(); audio.click(); sparkDistance %= Math.PI / 3; }
    }
    draw();
  });
  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) crank.addEventListener(name, event => {
    if (event.pointerId !== pointer) return;
    suppressPointerClickUntil = performance.now() + 600; releasePointer(); draw();
  });
  function keyboardStep() {
    engine.touch(); angle += Math.PI / 2; reelAngle += 0.45; angularVelocity = 2.6;
    engine.turn(Math.PI / 2); engine.release(); press = 0.6; emitSpark(true); audio.click(); draw();
  }
  crank.addEventListener('keydown', event => {
    if (event.key === ' ' || event.key === 'Enter') {
      event.preventDefault(); if (!event.repeat) keyboardStep();
    }
  });
  crank.addEventListener('click', event => {
    if (event.detail === 0 && performance.now() > suppressPointerClickUntil) keyboardStep();
  });

  // Evening wind and crank: one context and one master bus. No requests or audio files.
  const audio = {
    context: null, master: null, wind: null,
    buffer: null, activated: false, lastClick: -1,
    init() {
      if (this.context) return;
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) throw new Error('audio-unavailable');
      const a = this.context = new Context();
      this.master = a.createGain(); this.master.gain.value = 0; this.master.connect(a.destination);
      const buffer = a.createBuffer(1, a.sampleRate * 3, a.sampleRate);
      const values = buffer.getChannelData(0); let seed = 5147, brown = 0;
      for (let i = 0; i < values.length; i++) {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        brown = (brown + 0.025 * (seed / 4294967296 * 2 - 1)) / 1.025;
        values[i] = brown * 3.5;
      }
      this.buffer = buffer;
      const noise = a.createBufferSource(); noise.buffer = buffer; noise.loop = true;
      const filter = a.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 460; filter.Q.value = 0.35;
      this.wind = a.createGain(); this.wind.gain.value = 0.1;
      noise.connect(filter); filter.connect(this.wind); this.wind.connect(this.master); noise.start();
    },
    async activate() {
      if (this.activated && this.context?.state === 'running') return;
      try {
        this.init(); await this.context.resume();
        if (this.context.state !== 'running') throw new Error('audio-suspended');
        this.activated = true;
        this.master.gain.cancelScheduledValues(this.context.currentTime);
        this.master.gain.setTargetAtTime(0.38, this.context.currentTime, 0.45);
        world.dataset.audio = 'playing';
      } catch (_) {
        world.dataset.audio = 'waiting-for-first-touch';
      }
    },
    requestDefault() {
      world.dataset.audio = 'starting';
      this.activate();
    },
    click(strength = 1) {
      if (!this.activated || this.context.state !== 'running' || engine.time - this.lastClick < 0.08) return;
      this.lastClick = engine.time;
      const a = this.context, t = a.currentTime;
      const src = a.createBufferSource(); src.buffer = this.buffer;
      const filter = a.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1050; filter.Q.value = 0.8;
      const envelope = a.createGain(); envelope.gain.setValueAtTime(0, t);
      envelope.gain.linearRampToValueAtTime(0.3 * strength, t + 0.003);
      envelope.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      src.connect(filter); filter.connect(envelope); envelope.connect(this.master);
      src.start(t, 0.41); src.stop(t + 0.06);
      src.onended = () => { src.disconnect(); filter.disconnect(); envelope.disconnect(); };
    },
    async visibility() {
      if (!this.context) return;
      try {
        if (document.hidden) await this.context.suspend();
        else await this.activate();
      } catch (_) { world.dataset.audio = 'waiting-for-first-touch'; }
    }
  };
  window.addEventListener('pointerdown', () => audio.activate(), { passive: true });
  window.addEventListener('keydown', () => audio.activate(), { passive: true });

  function frame(now) {
    raf = 0;
    if (document.hidden || !ready) return;
    const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.05) : 0;
    lastFrame = now; engine.update(dt);
    press *= Math.exp(-dt * (pointer === null ? 11 : 1.2)); flash *= Math.exp(-dt * 7);
    if (pointer === null || now - previousMoveTime > 90) {
      angularVelocity *= Math.exp(-dt * 5.4);
      if (!motionPreference.matches) reelAngle += angularVelocity * dt * 0.25;
    }
    if (!motionPreference.matches && engine.phase === 'idle' && engine.time > nextIdleClick) {
      reelAngle += 0.043; nextIdleClick = engine.time + 4.4 + Math.sin(engine.time) * 1.2;
    }
    for (let i = sparks.length - 1; i >= 0; i--) if (engine.time - sparks[i].born > 0.57) sparks.splice(i, 1);
    const active = pointer !== null || engine.transition || engine.phase !== 'idle' || sparks.length || Math.abs(angularVelocity) > 0.02;
    if (active || now - lastPaint > (motionPreference.matches ? 250 : 65)) { draw(); lastPaint = now; }
    raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    releasePointer(); audio.visibility();
    if (raf) cancelAnimationFrame(raf);
    raf = 0; lastFrame = 0;
    if (!document.hidden && ready) raf = requestAnimationFrame(frame);
  });
  window.addEventListener('blur', () => releasePointer());
  window.addEventListener('resize', resize);
  motionPreference.addEventListener('change', () => { if (ready) draw(); });
  document.querySelector('#retry').addEventListener('click', start);
  async function start() {
    document.querySelector('#retry').hidden = true;
    document.querySelector('#loading-text').textContent = '放映机正在醒来';
    try {
      if (!ctx) throw new Error('canvas-unavailable');
      [night, peak] = await Promise.all([loadImage(DUSK_ASSETS.night), loadImage(DUSK_ASSETS.peak)]);
      stages = makeStages(); makeMovingParts(); ready = true; resize();
      crank.disabled = false;
      loading.hidden = true; world.classList.add('ready');
      audio.requestDefault();
      lastFrame = 0; raf = requestAnimationFrame(frame);
    } catch (_) {
      ready = false;
      document.querySelector('#loading-text').textContent = '画面还没准备好，点此重试';
      document.querySelector('#retry').hidden = false;
    }
  }
  start();
})();

</script>
</body>
</html>
