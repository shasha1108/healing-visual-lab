function showCard(){if(!started)return;document.querySelector('#snap').src=renderer.domElement['toDataURL']('image/jpeg',.86);document.querySelector('#card-text').textContent='标准打工人今天把 '+kicked+' 个拦路货送出了街角。';document.querySelector('#card').classList.add('show')}document.querySelector('#share-card').onclick=async()=>{const text='我在《KICK OFF》把 '+kicked+' 个拦路货踢出了街角。';try{if(navigator.share)await navigator.share({title:'KICK OFF',text,url:location.href});else await navigator.clipboard.writeText(location.href);cueText('链接已就位。')}catch(_){}};document.querySelector('#close-card').onclick=()=>document.querySelector('#card').classList.remove('show');
document.querySelector('#enter').onclick=()=>{started=true;initAudio();if(audio&&audio.state==='suspended')audio.resume();document.querySelector('#launch').classList.add('hide');cueText('点哪里，哪里飞。',1900)};document.querySelector('#camera').onclick=()=>{player.camMode=(player.camMode+1)%3;player.cam=player.facing+Math.PI+(player.camMode===0?0:player.camMode===1?.56:-.56);cueText(player.camMode===0?'跟随镜头':player.camMode===1?'右后方':'左后方',700)};
for(const [id,key]of[['go','go'],['back','back'],['left','left'],['right','right']]){const el=document.querySelector('#'+id),down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')keys.go=true;if(e.key==='s'||e.key==='ArrowDown')keys.back=true;if(e.key==='a'||e.key==='ArrowLeft')keys.left=true;if(e.key==='d'||e.key==='ArrowRight')keys.right=true});addEventListener('keyup',e=>{if(e.key==='w'||e.key==='ArrowUp')keys.go=false;if(e.key==='s'||e.key==='ArrowDown')keys.back=false;if(e.key==='a'||e.key==='ArrowLeft')keys.left=false;if(e.key==='d'||e.key==='ArrowRight')keys.right=false});
let drag=null;const look=document.querySelector('#look-zone'),spirit=document.querySelector('#spirit-cursor');look.addEventListener('pointerdown',e=>{if(!started)return;drag={x:e.clientX,cam:player.cam,moved:false};look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{spirit.style.left=e.clientX+'px';spirit.style.top=e.clientY+'px';spirit.classList.add('visible');if(drag){if(Math.abs(e.clientX-drag.x)>8)drag.moved=true;player.cam=drag.cam-(e.clientX-drag.x)*.012}});look.addEventListener('pointerup',e=>{if(drag&&!drag.moved)kickFromPoint(e.clientX,e.clientY);drag=null});look.addEventListener('pointercancel',()=>drag=null);
function updatePlayer(dt){const turn=(keys.left?-1:0)+(keys.right?1:0),move=(keys.go?1:0)+(keys.back?-1:0);if(turn)player.facing+=turn*dt*2.35;if(move){const speed=(keys.back?-1:1)*dt*4.1;player.p.x+=Math.sin(player.facing)*speed;player.p.z+=Math.cos(player.facing)*speed;player.p.x=Math.max(-9.2,Math.min(9.2,player.p.x));player.walk+=dt*12}else if(!drag){const desired=player.facing+Math.PI+(player.camMode===0?0:player.camMode===1?.56:-.56),delta=Math.atan2(Math.sin(desired-player.cam),Math.cos(desired-player.cam));player.cam+=delta*Math.min(1,dt*3.1)}avatar.position.copy(player.p);avatar.position.y=Math.sin(player.walk)*.035;avatar.rotation.y=player.facing-Math.PI;body.rotation.z=Math.sin(player.walk)*.025;armL.rotation.x=Math.sin(player.walk)*.36;armR.rotation.x=-Math.sin(player.walk)*.36;legL.rotation.x=Math.sin(player.walk)*.16;legR.rotation.x=-Math.sin(player.walk)*.16;if(player.kick>0){player.kick-=dt;const t=1-player.kick/.42;legR.rotation.x=-.22+Math.sin(Math.min(1,t)*Math.PI)*1.25}else legR.rotation.x+=(-Math.sin(player.walk)*.16-legR.rotation.x)*Math.min(1,dt*9)}
function updateWorld(dt,time){while(nextSpawn>player.p.z-48)spawnOne();for(const s of street)if(s.position.z>player.p.z+28)s.position.z-=street.length*12;for(let i=entities.length-1;i>=0;i--){const e=entities[i];e.cool=Math.max(0,e.cool-dt);if(e.dead){e.vel.y-=dt*11;e.root.position.addScaledVector(e.vel,dt);e.root.rotation.x+=e.spin.x*dt;e.root.rotation.y+=e.spin.y*dt;e.root.rotation.z+=e.spin.z*dt;if(e.root.position.y<.1){e.root.position.y=.1;e.vel.multiplyScalar(.42);e.vel.y=Math.abs(e.vel.y)*.24;e.settle+=dt}if(e.settle>1.15){e.root.traverse(o=>{const n=hitMeshes.indexOf(o);if(n>=0)hitMeshes.splice(n,1)});scene.remove(e.root);entities.splice(i,1)}}else{e.root.rotation.z*=Math.max(0,1-dt*9);e.root.position.y=Math.sin(time*.002+e.phase)*.035;const d=e.root.position.clone().sub(player.p);d.y=0;if(d.length()<.95)kick(e,'撞')}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.v.y-=dt*10;p.p.addScaledVector(p.v,dt);p.mesh.position.copy(p.p);p.mesh.rotation.x+=dt*8;p.mesh.scale.setScalar(Math.max(.01,p.life));if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1)}}}
const camPos=new THREE.Vector3(),lookAt=new THREE.Vector3();function updateCamera(dt){const angle=player.cam,fx=Math.sin(player.facing),fz=Math.cos(player.facing);camPos.set(player.p.x+Math.sin(angle)*8.15,5.25,player.p.z+Math.cos(angle)*8.15);camera.position.lerp(camPos,1-Math.exp(-dt*6.2));lookAt.set(player.p.x+fx*4,.82,player.p.z+fz*4);camera.lookAt(lookAt)}function frame(now){requestAnimationFrame(frame);const raw=Math.min((now-last)/1000,0.033);last=now;const dt=kickStop>0?(kickStop-=raw,0):raw;updatePlayer(dt);updateWorld(dt,now);updateCamera(raw);renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});frame(performance.now());
</script>
</body></html>
