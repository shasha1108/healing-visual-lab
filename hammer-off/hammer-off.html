    renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||!player.started)return;input.mouseLook=true;input.mouseX=e.clientX;input.mouseY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!input.mouseLook)return;look(e.clientX-input.mouseX,e.clientY-input.mouseY);input.mouseX=e.clientX;input.mouseY=e.clientY;});renderer.domElement.addEventListener('pointerup',()=>input.mouseLook=false);
    addEventListener('keydown',e=>{input.keys[e.code]=true;if(e.code==='Space'){start();swing();e.preventDefault();}if(e.code==='ShiftLeft'||e.code==='KeyE'){start();jump();}});addEventListener('keyup',e=>input.keys[e.code]=false);
    const cursor={x:0,y:0,tx:0,ty:0,ready:false};addEventListener('mousemove',e=>{cursor.tx=e.clientX;cursor.ty=e.clientY;if(!cursor.ready){cursor.ready=true;cursor.x=cursor.tx;cursor.y=cursor.ty;UI.cursor.style.opacity='1';}},{passive:true});function cursorLoop(){cursor.x+=(cursor.tx-cursor.x)*.13;cursor.y+=(cursor.ty-cursor.y)*.13;UI.cursor.style.transform=`translate(${cursor.x-12}px,${cursor.y-12}px)`;requestAnimationFrame(cursorLoop);}cursorLoop();
    addEventListener('contextmenu',e=>e.preventDefault());
  </script>
</body>
