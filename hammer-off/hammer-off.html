      btn.addEventListener('pointerdown',set);btn.addEventListener('pointerup',reset);btn.addEventListener('pointercancel',reset);btn.addEventListener('pointerleave',reset);
      btn.addEventListener('click',()=>{PLAYER.x=clamp(PLAYER.x+Number(btn.dataset.dir)*.72,-5.4,10.2);});
    });
    renderer.domElement.addEventListener('pointerdown',(e)=>{
      if(!State.started)return;if(e.clientX<innerWidth*.56){INPUT.dragging=true;INPUT.pointerX=e.clientX;renderer.domElement.setPointerCapture?.(e.pointerId);}else if(e.clientY<innerHeight*.68)tryHammer();
    });
    renderer.domElement.addEventListener('pointermove',(e)=>{if(!INPUT.dragging)return;INPUT.dir=clamp((e.clientX-INPUT.pointerX)/35,-1,1);});
    renderer.domElement.addEventListener('pointerup',()=>{INPUT.dragging=false;INPUT.dir=0;});renderer.domElement.addEventListener('pointercancel',()=>{INPUT.dragging=false;INPUT.dir=0;});
    addEventListener('keydown',(e)=>{if(['ArrowLeft','KeyA'].includes(e.code)){INPUT.keyLeft=true;e.preventDefault();}if(['ArrowRight','KeyD'].includes(e.code)){INPUT.keyRight=true;e.preventDefault();}if(['Space','KeyJ'].includes(e.code)){startExperience();tryHammer();e.preventDefault();}if(['ArrowUp','KeyW'].includes(e.code)){startExperience();tryJump();e.preventDefault();}});
    addEventListener('keyup',(e)=>{if(['ArrowLeft','KeyA'].includes(e.code))INPUT.keyLeft=false;if(['ArrowRight','KeyD'].includes(e.code))INPUT.keyRight=false;});
    addEventListener('contextmenu',e=>e.preventDefault());

    const cursor={x:0,y:0,tx:0,ty:0,ready:false};
    addEventListener('mousemove',(e)=>{cursor.tx=e.clientX;cursor.ty=e.clientY;if(!cursor.ready){cursor.ready=true;cursor.x=cursor.tx;cursor.y=cursor.ty;UI.cursor.style.opacity='1';}},{passive:true});
    addEventListener('pointerdown',()=>{if(cursor.ready){UI.cursor.style.width='34px';UI.cursor.style.height='34px';}}, {passive:true});
    addEventListener('pointerup',()=>{UI.cursor.style.width='26px';UI.cursor.style.height='26px';},{passive:true});
    function cursorLoop(){cursor.x+=(cursor.tx-cursor.x)*.12;cursor.y+=(cursor.ty-cursor.y)*.12;UI.cursor.style.transform=`translate(${cursor.x-13}px,${cursor.y-13}px)`;requestAnimationFrame(cursorLoop);}cursorLoop();

  </script>
</body>
</html>
